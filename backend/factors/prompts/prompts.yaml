# ============================================================================
# QuantaAlpha + LatentMAS prompts — optimized for Qwen3-4B + KV-cache pipeline
# ============================================================================
# Design principles (revised 2026-05-07):
#   1. Format spec at END (small models have stronger recency bias)
#   2. XML section markers (<scenario>, <hypothesis>, ...) for clean attention
#      boundaries — Qwen3 was trained on tag-rich data
#   3. History compressed to last 2 rounds — older context lives in latent KV-cache
#   4. Explicit LatentMAS KV-awareness — prompts tell the model that prior agent
#      context is in latent KV representation, not text
#   5. One primary task per prompt; multiple varied examples in output format
# ============================================================================


# ─── Helper Templates (rendered separately, injected as strings) ─────────────

potential_direction_transformation: |-
  Round 1 — the user supplied an initial direction:
  <potential_direction>{{ potential_direction }}</potential_direction>

  Transform it into a clear, actionable hypothesis. Requirements:
  1. **Specific** — name a concrete market phenomenon, not a generic theme.
  2. **Testable** — expressible as a formula on daily price-volume data ($open, $high, $low, $close, $volume, $return).
  3. **Aligned** — directly tied to the user's direction.


hypothesis_and_feedback: |-
  {% if trace.hist|length == 0 %}
  <history>This is round 1. No prior trajectory yet.</history>
  {% else %}
  <history>
  {% for hypothesis, experiment, feedback in trace.hist[-2:] %}
  <round id="{{ loop.index }}">
    <hypothesis>{{ hypothesis }}</hypothesis>
    <observations>{{ feedback.observations }}</observations>
    <evaluation>{{ feedback.hypothesis_evaluation }}</evaluation>
    <next_direction>{{ feedback.new_hypothesis }}</next_direction>
    <reasoning>{{ feedback.reason }}</reasoning>
    <improved_sota>{{ feedback.decision }}</improved_sota>
  </round>
  {% endfor %}
  </history>
  Note: rounds older than 2 are preserved in the latent KV-cache.
  {% endif %}


hypothesis_output_format: |-
  {
    "hypothesis": "ONE LINE. The new market hypothesis.",
    "concise_knowledge": "ONE LINE. Conditional pattern, e.g. 'When volatility spikes after low-volume periods, mean-reversion is amplified.'",
    "concise_observation": "ONE LINE. Data pattern or prior result that motivates this hypothesis.",
    "concise_justification": "ONE LINE. Economic or behavioral reasoning. Why this should work.",
    "concise_specification": "ONE LINE. Scope, variables, time horizon, expected effect."
  }


factor_hypothesis_specification: |-
  Hypothesis design guidance:
  - Data-grounded: align with daily price-volume data ($open, $high, $low, $close, $volume, $return) — temporal, cross-sectional, or distributional patterns.
  - Theory-grounded: name an economic or behavioral driver (momentum, mean-reversion, microstructure, regime, sentiment).
  - Iterative: build on latent KV memory — refine within a framework before pivoting.
  - Anti-overfit: prefer robust simple effects over many free parameters.


function_lib_description: |-
  Only the following operations are allowed in expressions:
  ### **Cross-sectional Functions**
  - **RANK(A)**: Ranking of each element in the cross-sectional dimension of A.
  - **ZSCORE(A)**: Z-score of each element in the cross-sectional dimension of A.
  - **MEAN(A)**: Mean value of each element in the cross-sectional dimension of A.
  - **STD(A)**: Standard deviation in the cross-sectional dimension of A.
  - **SKEW(A)**: Skewness in the cross-sectional dimension of A.
  - **KURT(A)**: Kurtosis in the cross-sectional dimension of A.
  - **MAX(A)**: Maximum value in the cross-sectional dimension of A.
  - **MIN(A)**: Minimum value in the cross-sectional dimension of A.
  - **MEDIAN(A)**: Median value in the cross-sectional dimension of A

  ### **Time-Series Functions**
  - **DELTA(A, n)**: Change in value of A over n periods.
  - **DELAY(A, n)**: Value of A delayed by n periods.
  - **TS_MEAN(A, n)**: Mean value of sequence A over the past n days.
  - **TS_SUM(A, n)**: Sum of sequence A over the past n days.
  - **TS_RANK(A, n)**: Time-series rank of the last value of A in the past n days.
  - **TS_ZSCORE(A, n)**: Z-score for each sequence in A over the past n days.
  - **TS_MEDIAN(A, n)**: Median value of sequence A over the past n days.
  - **TS_PCTCHANGE(A, p)**: Percentage change in the value of sequence A over p periods.
  - **TS_MIN(A, n)**: Minimum value of A in the past n days.
  - **TS_MAX(A, n)**: Maximum value of A in the past n days.
  - **TS_ARGMAX(A, n)**: The index (relative to the current time) of the maximum value of A over the past n days.
  - **TS_ARGMIN(A, n)**: The index (relative to the current time) of the minimum value of A over the past n days.
  - **TS_QUANTILE(A, p, q)**: Rolling quantile of sequence A over the past p periods, where q is the quantile value between 0 and 1.
  - **TS_STD(A, n)**: Standard deviation of sequence A over the past n days.
  - **TS_VAR(A, p)**: Rolling variance of sequence A over the past p periods.
  - **TS_CORR(A, B, n)**: Correlation coefficient between sequences A and B over the past n days.
  - **TS_COVARIANCE(A, B, n)**: Covariance between sequences A and B over the past n days.
  - **TS_MAD(A, n)**: Rolling Median Absolute Deviation of sequence A over the past n days.
  - **PERCENTILE(A, q, p)**: Quantile of sequence A, where q is the quantile value between 0 and 1. If p is provided, it calculates the rolling quantile over the past p periods.
  - **HIGHDAY(A, n)**: Number of days since the highest value of A in the past n days.
  - **LOWDAY(A, n)**: Number of days since the lowest value of A in the past n days.
  - **SUMAC(A, n)**: Cumulative sum of A over the past n days.

  ### **Moving Averages and Smoothing Functions**
  - **SMA(A, n, m)**: Simple moving average of A over n periods with modifier m.
  - **WMA(A, n)**: Weighted moving average of A over n periods, with weights decreasing from 0.9 to 0.9^(n).
  - **EMA(A, n)**: Exponential moving average of A over n periods, where the decay factor is 2/(n+1).
  - **DECAYLINEAR(A, d)**: Linearly weighted moving average of A over d periods, with weights increasing from 1 to d.

  ### **Mathematical Operations**
  - **PROD(A, n)**: Product of values in A over the past n days. Use `*` for general multiplication.
  - **LOG(A)**: Natural logarithm of each element in A.
  - **SQRT(A)**: Square root of each element in A.
  - **POW(A, n)**: Raise each element in A to the power of n.
  - **SIGN(A)**: Sign of each element in A, one of 1, 0, or -1.
  - **EXP(A)**: Exponential of each element in A.
  - **ABS(A)**: Absolute value of A.
  - **MAX(A, B)**: Maximum value between A and B.
  - **MIN(A, B)**: Minimum value between A and B.
  - **INV(A)**: Reciprocal (1/x) of each element in sequence A.
  - **FLOOR(A)**: Floor of each element in sequence A.

  ### **Conditional and Logical Functions**
  - **COUNT(C, n)**: Count of samples satisfying condition C in the past n periods. Here, C is a logical expression, e.g., `$close > $open`.
  - **SUMIF(A, n, C)**: Sum of A over the past n periods if condition C is met. Here, C is a logical expression.
  - **FILTER(A, C)**: Filtering multi-column sequence A based on condition C. Here, C is presented in a logical expression form, with the same size as A.
  - **(C1)&&(C2)**: Logical operation "and". Both C1 and C2 are logical expressions, such as A > B.
  - **(C1)||(C2)**: Logical operation "or". Both C1 and C2 are logical expressions, such as A > B.
  - **(C1)?(A):(B)**: Logical operation "If condition C1 holds, then A, otherwise B". C1 is a logical expression, such as A > B.

  ### **Regression and Residual Functions**
  - **SEQUENCE(n)**: A single-column sequence of length n, ranging from 1 to integer n. `SEQUENCE()` should always be nested in `REGBETA()` or `REGRESI()` as argument B.
  - **REGBETA(A, B, n)**: Regression coefficient of A on B using the past n samples, where A MUST be a multi-column sequence and B a single-column or multi-column sequence.
  - **REGRESI(A, B, n)**: Residual of regression of A on B using the past n samples, where A MUST be a multi-column sequence and B a single-column or multi-column sequence.

  ### **Technical Indicators**
  - **RSI(A, n)**: Relative Strength Index of sequence A over n periods. Measures momentum by comparing the magnitude of recent gains to recent losses.
  - **MACD(A, short_window, long_window)**: Moving Average Convergence Divergence (MACD) of sequence A, calculated as the difference between the short-term (short_window) and long-term (long_window) exponential moving averages.
  - **BB_MIDDLE(A, n)**: Middle Bollinger Band, calculated as the n-period simple moving average of sequence A.
  - **BB_UPPER(A, n)**: Upper Bollinger Band, calculated as middle band plus two standard deviations of sequence A over n periods.
  - **BB_LOWER(A, n)**: Lower Bollinger Band, calculated as middle band minus two standard deviations of sequence A over n periods.

  Notes:
  - Only the variables provided in data (e.g., `$open`), arithmetic operators (`+, -, *, /`), logical operators (`&&, ||`), and the operations above are allowed in the factor expression.
  - Make sure each factor expression contains at least one variable (e.g. $open) combined with registered operations above. Do NOT use any undeclared variable (e.g. 'n', 'w_1') or undefined symbols (e.g., '=').
  - Pay attention to the distinction between TS-prefix operations (e.g., `TS_STD()`) and non-TS ones (e.g., `STD()`).


experiment_output_format: |-
  Write 2-3 factors. For EACH factor write exactly four lines, in this order:

  NAME: <short factor name, letters/digits/underscore only, no spaces>
  DESC: <one sentence — what the factor measures>
  VARS: <each variable as $sym=meaning, separated by ;>
  EXPR: <the factor expression on one line>

  Separate factors with one blank line. Output ONLY these lines — no JSON, no
  markdown, no commentary. EXPR must use only $open/$close/$high/$low/$volume/$return
  and the allowed operators.

  Example (write your own content, do not copy this):
  NAME: HighVolumeDayCount_10D
  DESC: Number of days in the past 10 days where volume exceeded its 20-day average, cross-sectionally ranked
  VARS: $volume=daily trading volume
  EXPR: RANK(COUNT($volume > TS_MEAN($volume, 20), 10))

  NAME: ReturnOnHighVolumeDays_5D
  DESC: Cumulative return earned only on days when volume is above its 20-day average over 5 days
  VARS: $return=daily return;$volume=daily trading volume
  EXPR: RANK(SUMIF($return, 5, $volume > TS_MEAN($volume, 20)))


# ─── Feedback Agent (Evaluation) ─────────────────────────────────────────────

factor_feedback_generation:
  system: |-
    Role: Evaluation Agent

    Mission
    Assess backtest results for a set of quantitative factors and produce a concrete next-direction for the Propose agent.

    Evaluation Rules:
    - IC (Information Coefficient): ≥ 0.02 annualized is meaningful signal; negative IC = signal is reversed or absent
    - annualized_return: interpret alongside IC — high return + low IC = lucky and fragile, not a real signal
    - max_drawdown: closer to 0 is better; > 0.3 means the signal is fragile or overfitting to specific periods
    - Factors with `<implemented>False</implemented>` never ran — skip them entirely, do not comment on them
    - If `<complexity_warning>` is present: the next hypothesis MUST redesign from scratch (fundamentally simpler structure, not parameter tweaks)
    - Guiding principle: simple IC=0.03 that generalizes > complex IC=0.06 that overfits to the sample

    Analysis Protocol — work through each question before writing output:
    Q1: Is IC positive for at least one implemented factor? Does any reach IC ≥ 0.02?
    Q2: Does annualized_return align with IC direction? (Both positive = consistent signal; diverging = suspect, may be data artifact)
    Q3: Is max_drawdown < 0.3 for any factor? (Yes = signal is relatively stable across the period)
    Q4: Overall verdict — hypothesis confirmed (IC + return both positive), partially confirmed (IC positive, weak return), or refuted (IC ≤ 0)?
    Q5: Based on Q1–Q4, what is the most natural unexplored angle to pursue next? Should be specific (mechanism + data + horizon), not generic.

    Prior hypothesis and factor expressions are in latent KV representation.

    <scenario>
    {{ scenario }}
    </scenario>

  user: |-
    <target_hypothesis>
    {{ hypothesis_text }}
    </target_hypothesis>

    <factors>
    {% for task in task_details %}
    <factor name="{{ task.factor_name }}">
      <description>{{ task.factor_description }}</description>
      <formulation>{{ task.factor_formulation }}</formulation>
      <variables>{{ task.variables }}</variables>
      <implemented>{{ task.factor_implementation }}</implemented>
      {% if task.get("complexity_feedback") and task.complexity_feedback %}
      <complexity_warning>{{ task.complexity_feedback }}</complexity_warning>
      {% endif %}
    </factor>
    {% endfor %}
    </factors>

    <backtest_results>
    {{ combined_result }}
    </backtest_results>

    Work through Q1–Q5 from the Analysis Protocol. Then output ONLY this JSON (no markdown fences):
    {
      "Observations": "What the metrics concretely show — reference specific IC and return values. 1-2 sentences.",
      "Feedback for Hypothesis": "Whether the results confirm, partially confirm, or refute the hypothesis. 1-2 sentences.",
      "New Hypothesis": "Next direction for Propose — specific mechanism, data signal, and time horizon. 1 sentence.",
      "Reasoning": "Why this next direction follows from Q1-Q5 analysis. 1 sentence.",
      "Replace Best Result": "yes or no"
    }


# ─── Propose Agent (Idea generator) ──────────────────────────────────────────

hypothesis_gen:
  system_prompt: |-
    Role: Hypothesis Agent

    Mission
    Generate ONE new, testable quantitative alpha factor hypothesis per call. This hypothesis will be passed to a downstream Expression agent that translates it into a formula.

    Domain Rules (enforced downstream — violation causes discard):
    - Available data: daily $open, $close, $high, $low, $volume, $return ONLY
    - All factors must be cross-sectionally rankable (output: per-stock numeric score)
    - Time windows: 1–60 days; nested windows must not exceed 60 days total
    - No look-ahead bias: only past and current-day data allowed

    Prior Context
    The prior-round trajectory (hypotheses, factor expressions, backtest results, feedback) lives in latent KV representation — you already have access to it without it appearing in this prompt text.

    Hypothesis Quality Protocol — think through each step before writing:
    Step 1 (Mechanism): Name the specific market phenomenon — a behavioral bias, microstructure pattern, or regime-conditional effect. Not a generic theme.
    Step 2 (Data): Which of $open/$close/$high/$low/$volume/$return does this rely on, and over what time window (1–60 days)?
    Step 3 (Distinctiveness): Based on the KV history, is this genuinely different from what was already tried?
    Step 4 (Conditional): When or where is this effect strongest? State the condition (volatility regime, post-event window, volume state).

    Domain Anchors — known patterns to build on or deliberately diverge from:
    - Momentum: short-term (3–10d) price continuation; long-term (60d+) reversal tendency
    - Mean-reversion: amplified after large 1-day moves; driven by retail overreaction
    - Liquidity premium: low-turnover / high-spread stocks carry expected return premium
    - Open-close gap: captures institutional (overnight positioning) vs retail (intraday) flow
    - Volume-price divergence: volume spike without proportional price move signals trend exhaustion
    - Volatility regime: many signals flip sign between high-vol and low-vol market periods
    - Intraday range: ($high - $low) / $close captures realized volatility and uncertainty

    <scenario>
    {{ scenario }}
    </scenario>

    {% if hypothesis_specification %}
    <guidance>
    {{ hypothesis_specification }}
    </guidance>
    {% endif %}

    Output ONLY this JSON (no markdown fences, no commentary):
    {{ hypothesis_output_format }}

  user_prompt: |-
    {{ hypothesis_and_feedback }}

    {% if RAG %}
    <reference>
    {{ RAG }}
    </reference>
    {% endif %}

    {% if round == 0 %}
    Round 1 — no prior feedback. Choose a specific mechanism from the domain anchors (or deliberately diverge from one). Make it concrete: name the behavior, the data signal, and the expected time horizon.
    {% else %}
    Round {{ round + 1 }} — the KV history holds prior results. Refine within the current framework if it showed partial IC signal (IC > 0 for any factor). Pivot to a new framework only if 2+ consecutive rounds in the current one produced IC ≤ 0 for all factors.
    {% endif %}

    For `concise_knowledge`: write a transferable conditional pattern specific to this quant context — for example "When volume drops below its 20-day average for 3+ consecutive days, next-day price reversal is amplified." Avoid generic statements. Do NOT reference "previous hypothesis" since the downstream reader may not have that context.

    Now output the JSON.


# ─── Construct Agent (Expression generator) ──────────────────────────────────

hypothesis2experiment:
  system_prompt: |-
    Role: Expression Agent

    Mission
    Translate a market hypothesis into 2-3 symbolic factor expressions ready for backtesting.

    Expression Rules (strictly enforced — any violation causes discard):
    - Use ONLY: $open, $close, $high, $low, $volume, $return and the allowed operators
    - Symbol length: ≤ 250 characters per expression
    - Distinct base features: ≤ 6 per expression
    - Free parameters: ≤ 50% of all nodes in the expression tree
    - Time windows: 1–60 days; nested windows must not exceed 60 days total

    Each factor must capture the hypothesis through a different structural approach — vary the operator family (e.g. one correlation-based, one conditional-count-based, one regression-based). All operator families in the allowed list are equally valid.
    Prior complexity warnings in the KV history → this round must use a simpler structure.

    Prior Context: domain background and hypothesis trajectory are in latent KV representation from the Propose step.

    <scenario>
    {{ scenario }}
    </scenario>

    Output format — follow it exactly:
    {{ experiment_output_format }}

  user_prompt: |-
    <target_hypothesis>
    {{ target_hypothesis }}
    </target_hypothesis>

    {{ hypothesis_and_feedback }}

    <allowed_variables>
    All daily-level: $open, $close, $high, $low, $volume, $return
    </allowed_variables>

    <allowed_functions>
    {{ function_lib_description }}
    </allowed_functions>

    {% if expression_duplication %}
    <duplication_alert>
    {{ expression_duplication }}
    </duplication_alert>
    {% endif %}

    Generate 2-3 independent {{ targets }} that implement the hypothesis above. Choose any operator families that best capture the market mechanism — conditional logic, correlation, regression, count-based, and smoothing functions are all valid choices. Now write the factors.


# ─── Construct duplication-check fragment (rendered conditionally) ───────────

expression_duplication: |-
  - Proposed expression: {{ prev_expression }}
  {% if duplicated_subtree_size > duplication_threshold %}
  - **Novelty check FAILED**: duplicated subtree size ({{ duplicated_subtree_size }}) > threshold ({{ duplication_threshold }}).
  - Duplicated sub-expression: {{ duplicated_subtree }}
    {% if matched_alpha %}Matched with: {{ matched_alpha }}{% endif %}
  {% endif %}
  {% if free_args_ratio >= 0.5 %}
  - **Parsimony check FAILED**: free-args ratio ({{ "%.2f"|format(free_args_ratio * 100) }}%) ≥ 50% ({{ num_free_args }} of {{ num_all_nodes }} nodes). Reduce free parameters.
  {% endif %}
  {% if unique_vars_ratio >= 0.5 %}
  - **Diversity check FAILED**: unique-vars ratio ({{ "%.2f"|format(unique_vars_ratio * 100) }}%) ≥ 50% ({{ num_unique_vars }} of {{ num_all_nodes }}). Repeat variables more or use simpler structures.
  {% endif %}
  {% if symbol_length > symbol_length_threshold %}
  - **SL check FAILED**: expression length ({{ symbol_length }}) > limit ({{ symbol_length_threshold }}). Overfitting risk. Redesign from scratch — target 50-150 chars.
    - GOOD example (~50): `RANK(TS_MEAN($return, 20))`
    - GOOD example (~100): `RANK(TS_CORR($close, $volume, 10)) * SIGN(TS_MEAN($return, 5))`
  {% endif %}
  {% if num_base_features > base_features_threshold %}
  - **ER check FAILED**: {{ num_base_features }} distinct base features > limit ({{ base_features_threshold }}). Focus on 2-4 core features.
  {% endif %}
