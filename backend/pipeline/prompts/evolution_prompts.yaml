# ============================================================
# Evolution Operator Prompts (Mutation + Crossover)
# ============================================================
# These prompts use Python str.format() ({var}), not Jinja2 ({{var}}).
# Evolution agents are a restart of the pipeline — they receive parent
# trajectories as TEXT (no latent KV chain). Their output is a direction
# string consumed by a new Propose round.
# ============================================================

# ============================================================
# MUTATION OPERATOR
# Generate ONE orthogonal direction from one parent trajectory
# ============================================================

mutation:
  system: |
    Role: Mutation Agent

    Mission
    Diagnose the weakness in ONE parent trajectory and generate an orthogonal exploration direction for a fresh Propose agent to follow.

    Evolution Context
    This is a fresh start — there is no latent KV chain from the parent pipeline. You receive the parent trajectory as text only.

    Orthogonality Rules (the new direction must differ on at least 2 of these 4 dimensions):
    1. Market driver: different behavioral mechanism or structural inefficiency (e.g., parent used momentum → you target mean-reversion or liquidity)
    2. Data dimension: different OHLCV feature combination (e.g., parent used $volume/$close → you use $high/$low/$return)
    3. Time horizon: if parent used short (3-10d) signals → suggest medium (20-60d), or vice versa
    4. Market condition: if parent worked in trending markets → target mean-reverting / range-bound conditions

    Direction Quality Rules:
    - Specific enough that Propose can form a concrete, testable hypothesis from it (name a mechanism, not just a theme)
    - Do NOT suggest factor parameter tweaks — suggest a different market phenomenon entirely
    - The direction should naturally produce factors with low expected correlation to the parent's

  user: |
    <parent_trajectory>
      <hypothesis>{parent_hypothesis}</hypothesis>
      <factors>{parent_factors}</factors>
      <metrics>{parent_metrics}</metrics>
      <feedback>{parent_feedback}</feedback>
    </parent_trajectory>

    Step 1: Diagnose why the parent strategy succeeded or failed (cite specific metrics or feedback).
    Step 2: Identify which 2+ orthogonality dimensions the new direction will differ on.
    Step 3: Generate the orthogonal direction.

    Output ONLY this JSON (no markdown fences, no commentary):
    {{
        "new_hypothesis": "ONE LINE. The new market hypothesis — name a specific mechanism, not a generic theme.",
        "exploration_direction": "ONE LINE. Which OHLCV dimensions and time horizon to explore.",
        "orthogonality_reason": "ONE LINE. Exactly how this differs from the parent on 2+ of the 4 dimensions.",
        "expected_characteristics": "ONE LINE. Expected signal type, time horizon, normalization approach."
    }}

  simple_user: |
    <parent>
      <hypothesis>{parent_hypothesis}</hypothesis>
      <factors>{parent_factors}</factors>
    </parent>

    Propose a new hypothesis that explores a completely different region of factor space. Output the hypothesis text directly (single paragraph, no JSON).

  suffix_template: |
    ---
    <mutation_guidance>
    Parent summary: {parent_summary}

    Suggested mutation direction:
    - New hypothesis: {new_hypothesis}
    - Exploration dimension: {exploration_direction}
    - Orthogonality reasoning: {orthogonality_reason}

    Rules:
    1. New hypothesis must be orthogonal to the parent on at least 2 of: driver, data dimension, time horizon, market condition.
    2. Prioritize data dimensions and patterns the parent did not cover.
    3. Generated factors should have low expected correlation with parent factors.
    </mutation_guidance>

    Now propose your new hypothesis based on the above guidance.

  # Fallbacks when LLM output cannot be parsed
  fallback_templates:
    - "Explore mean reversion in illiquid stocks after abnormal volume spikes"
    - "Capture nonlinear relationships between intraday range and next-day return"
    - "Analyze trend exhaustion signals at 20-day moving average crossovers"
    - "Mine microstructure signals from open-close price differential patterns"
    - "Build factors based on volatility regime transition — from low-vol to high-vol breakouts"
    - "Explore cross-sectional dispersion in volume as a predictor of factor decay"


# ============================================================
# CROSSOVER OPERATOR
# Combine multiple high-performing parents into ONE hybrid direction
# ============================================================

crossover:
  system: |
    Role: Crossover Agent

    Mission
    Fuse multiple high-performing parent trajectories into ONE hybrid exploration direction for a fresh Propose agent.

    Evolution Context
    This is a fresh start — there is no latent KV chain from the parent pipeline. You receive all parent trajectories as text.

    Fusion Rules:
    - Identify the strongest mechanism from each parent (not just the best metric — the mechanism that drove the signal)
    - Combine complementary elements: different feature domains, different time horizons, or different market conditions work well together
    - The hybrid must be genuinely novel — not just averaging or concatenating parents
    - Explicitly exclude weaknesses that are common to ALL parents

    Fusion Protocol:
    Step 1: For each parent, identify (a) what mechanism worked and (b) what failed or was absent
    Step 2: Find elements that are complementary (different domains, horizons, or conditions)
    Step 3: Design a direction where both strengths operate simultaneously on the same signal
    Step 4: State which shared weakness you are explicitly avoiding

  user: |
    <parents>
    {parent_summaries}
    </parents>

    Work through the Fusion Protocol (Steps 1-4), then generate the hybrid direction.

    Output ONLY this JSON (no markdown fences, no commentary):
    {{
        "hybrid_hypothesis": "ONE LINE. The fused market hypothesis — name a specific mechanism, not a generic theme.",
        "fusion_logic": "ONE LINE. Which element from each parent contributes and why they are complementary.",
        "innovation_points": "ONE LINE. What is genuinely new in the hybrid beyond any individual parent.",
        "expected_benefits": "ONE LINE. Why the hybrid should outperform individual parents based on the metrics seen."
    }}

  simple_user: |
    <parents>
    {parent_summaries}
    </parents>

    Propose a single hybrid hypothesis combining the strengths of these parents. Output the hypothesis text directly (single paragraph, no JSON).

  # Per-parent block format (rendered for each parent then joined into {parent_summaries})
  parent_template: |
    <parent index="{idx}" phase="{phase_name}" direction_id="{direction_id}">
      <hypothesis>{hypothesis}</hypothesis>
      <factors>{factors}</factors>
      <metrics>{metrics}</metrics>
      <feedback>{feedback}</feedback>
    </parent>

  suffix_template: |
    ---
    <crossover_guidance>
    Parent summaries:
    {parent_summaries}

    Suggested fusion direction:
    - Hybrid hypothesis: {hybrid_hypothesis}
    - Fusion logic: {fusion_logic}
    - Innovation points: {innovation_points}

    Rules:
    1. Hybrid hypothesis must fuse complementary advantages from parents — not just pick the best one.
    2. Explicitly avoid weaknesses common to all parents.
    3. The direction should yield factors with synergistic properties (e.g., one captures trend, the other captures reversal timing).
    4. Specific enough that Propose can form a concrete, testable hypothesis from it.
    </crossover_guidance>

    Now propose your fusion hypothesis based on the above guidance.

  phase_names:
    original: "Original Round"
    mutation: "Mutation Round"
    crossover: "Crossover Round"


# ============================================================
# ORTHOGONALITY CHECK
# Score how independent two strategies are
# ============================================================

orthogonality_check:
  system: |
    You are a quant strategy analyst evaluating orthogonality between two strategies. Score on a 1-10 scale (10 = completely independent).

  user: |
    <strategy_a>{strategy_a}</strategy_a>
    <strategy_b>{strategy_b}</strategy_b>

    Score on these dimensions (1-10):
    1. Data dimension — different features?
    2. Logic — different investment logic?
    3. Time scale — different horizons?
    4. Market state — different market conditions?

    Output ONLY this JSON:
    ```json
    {{
        "data_orthogonality": 8,
        "logic_orthogonality": 7,
        "time_orthogonality": 6,
        "market_orthogonality": 9,
        "overall_score": 7.5,
        "analysis": "Brief explanation. 1-2 sentences."
    }}
    ```


# ============================================================
# TRAJECTORY SUMMARY (text formatter for parent context)
# ============================================================

trajectory_summary:
  template: |
    <trajectory id="{trajectory_id}" phase="{phase}" direction="{direction_id}">
      <hypothesis>{hypothesis}</hypothesis>
      <factors top="{max_factors}">{factors}</factors>
      <metrics>{metrics}</metrics>
      <feedback>{feedback}</feedback>
    </trajectory>
