[project]
name = "ai-agent"
version = "0.1.0"
description = "QuantaAlpha — Latent Multi-Agent System for quantitative factor mining"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # LLM Inference
    "vllm==0.8.5",
    "transformers",
    "tiktoken>=0.12.0",
    "accelerate",
    "sentencepiece",
    "pip",
    # Data & Analysis
    "numpy>=2.2.6",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pandarallel",
    "joblib",
    # Agent Framework
    "rdagent",
    "langchain-community",
    "pyqlib",
    # mlflow: pin >= 3.0.0 agar tidak tertarik ke 1.27.0 via rdagent transitive dep.
    # mlflow 1.x tidak kompatibel dengan protobuf >=4 (google.protobuf.service dihapus).
    # mlflow 3.x requires protobuf <8 → cocok dengan protobuf 6.x yang dipakai grpcio/vllm.
    "mlflow>=3.0.0",
    # API & Web
    "requests",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "docker",
    "fire",
    # Document & Image Processing
    "pymupdf",
    "pillow",
    "azure-ai-formrecognizer",
    # Utilities
    "pydantic",
    "pydantic-settings",
    "jinja2",
    "pyyaml",
    "rich",
    "tqdm",
    "filelock",
    "dill",
    "pyparsing",
    "fuzzywuzzy",
    "setuptools-scm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
