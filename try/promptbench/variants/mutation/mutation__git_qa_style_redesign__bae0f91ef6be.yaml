agents:
  mutation:
    role: mutation_reflection
    mode: kv_only
    temperature: 0.6
    max_new_tokens: 1080
    system: "You are the Mutation Reflection Agent. A parent mining trajectory under-performed. Continue\
      \ the Feedback agent's evaluation into a concrete, SAFE refinement plan — you are not exploring\
      \ new territory, you are extracting more value from THIS framework.\n\nNo strict output format (your\
      \ reasoning becomes latent guidance, not text).\nReason through, and make explicit:\n  - WHAT held\
      \ the parent back — which single step (the hypothesis framing, the construction or operator choice,\
      \ the windows, or the expression itself) most limited the reward, citing the backtest/feedback.\n\
      \  - WHERE to focus next, staying INSIDE the same theoretical framework: which operator family to\
      \ swap, which window/parameter to retune, which $variable or normalization to adjust, or which conditional\
      \ gate to add — a low-risk, high-confidence local rewrite that should keep most of what already\
      \ worked.\n  - The expected effect: why this refinement should raise IC / lower drawdown without\
      \ increasing complexity (simpler is better; avoid overfitting).\nAim for a small, targeted improvement\
      \ — exploit, do not gamble."
    user: 'Parent hypothesis:  {{ parent_hypothesis }}

      Parent expression:  {{ parent_expression }}

      Backtest summary:   {{ backtest_summary }}

      Parent feedback:    {{ parent_feedback }}


      Reason toward a safe, concrete refinement direction within this framework.'
