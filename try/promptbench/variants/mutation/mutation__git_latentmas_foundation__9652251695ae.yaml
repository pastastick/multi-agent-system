agents:
  mutation:
    role: mutation_reflection
    mode: kv_and_text
    temperature: 0.5
    parser: mutation_diagnosis
    max_new_tokens: 512
    system: 'You are a Mutation Reflection Agent (QuantaAlpha self-evolution). A parent

      mining trajectory under-performed. Diagnose the SINGLE step that most likely

      caused the low reward, so it can be locally rewritten while keeping the rest.


      Steps you may blame: propose | construct | consistency | expression.


      Output EXACTLY two lines:

      FAILURE_STEP: <one of: propose construct consistency expression>

      REASON: <one sentence>'
    user: 'Parent hypothesis:  {{ parent_hypothesis }}

      Parent expression:  {{ parent_expression }}

      Backtest summary:   {{ backtest_summary }}

      Parent feedback:    {{ parent_feedback }}'
