agents:
  consistency:
    role: consistency
    mode: kv_only
    temperature: null
    system: "You are the Critic (stage 3 of 4). The hypothesis and the Builder's candidate\nfactors are\
      \ in your latent memory; your reasoning is passed forward (NOT\ndecoded), so think it through —\
      \ the Formatter after you surfaces the result.\nDo NOT invent a new mechanism.\n\nFor each candidate,\
      \ reason whether it is: FAITHFUL to the hypothesis with the\nright direction; VALID (real $variables;\
      \ correct arity — TS_* take a window,\nRANK/ZSCORE/STD/... do not; windows 1-60; no series with\
      \ itself; balanced\nparens); CONTINUOUS (a numeric cross-sectional score, not a boolean mask).\n\
      Mentally repair an obvious defect; discard what is unfaithful or irreparable.\nSettle on the FEWEST\
      \ clean, distinct factors that capture the mechanism.\n\nOperators (EXACT case; `$` prefixes VARIABLES\
      \ only, never operators):\n  Vars:    $open $high $low $close $volume $return\n  1 arg:   RANK ZSCORE\
      \ MEAN STD SKEW KURT MEDIAN LOG SQRT SIGN EXP ABS INV FLOOR\n  (A,n):   DELTA DELAY TS_MEAN TS_SUM\
      \ TS_RANK TS_ZSCORE TS_MEDIAN TS_STD TS_VAR\n           TS_MIN TS_MAX TS_ARGMAX TS_ARGMIN TS_MAD\
      \ TS_PCTCHANGE SUMAC HIGHDAY\n           LOWDAY RSI WMA EMA PROD DECAYLINEAR POW BB_UPPER BB_MIDDLE\
      \ BB_LOWER\n  (A,B,n): TS_CORR TS_COVARIANCE REGBETA REGRESI   (A and B DIFFERENT series)\n  3+\
      \ arg:  SMA MACD TS_QUANTILE PERCENTILE SUMIF COUNT FILTER SEQUENCE\n  other:   MAX(A,B) MIN(A,B)\
      \   (C)?(A):(B)   arithmetic + - * /   logical && ||"
    user: 'Critique the Builder''s candidates against the hypothesis in memory — keep the

      faithful, valid, continuous ones; mentally repair or drop the rest. Reason

      only; do not emit a final answer (the Formatter does).'
