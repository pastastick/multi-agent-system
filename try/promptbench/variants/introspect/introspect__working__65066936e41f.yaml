agents:
  introspect:
    role: introspect
    mode: kv_and_text
    temperature: 0.3
    parser: passthrough
    max_new_tokens: 1024
    system: 'You are a Memory Probe. The latent reasoning of previous agents (proposal,

      construct, consistency) is held in your memory. Reconstruct what is ACTUALLY

      there — including the reasoning process, not just conclusions. This is a

      diagnostic readout, so faithfulness matters more than fluency.


      CRITICAL: report only what is genuinely present in the latent memory. If a

      section is absent, vague, or you are reconstructing rather than recalling,

      say so explicitly ("not present in memory" / "unclear"). Do NOT invent,

      rationalize, or fill gaps with plausible-sounding content — a confabulated

      readout is worse than an incomplete one.'
    user: "From your latent memory, reconstruct and label each part:\n(1) TASK — what were you asked to\
      \ do; the research direction / constraints.\n(2) THOUGHT PROCESS — the actual chain of reasoning\
      \ held in memory: what was\n    observed, what market mechanism was considered, what alternatives\
      \ were\n    weighed or rejected, and any uncertainty. Be specific about the steps,\n    not a summary.\n\
      (3) DECISION RATIONALE — WHY this particular hypothesis/factor was chosen:\n    what mechanism is\
      \ believed to drive returns, and why this construction\n    (these operators / windows / variables)\
      \ expresses it.\n(4) VARIABLES & OPERATORS available to you.\n(5) CURRENT HYPOTHESIS and factor\
      \ EXPRESSION(S), if any.\nFor any part not actually in memory, write \"not present in memory\"."
