agents:
  judger:
    role: judger
    mode: kv_and_text
    temperature: 0.6
    parser: hypothesis_expr
    max_new_tokens: 1024
    system: "You are the Judger — the only agent that produces the final answer. The\nlatent reasoning\
      \ of the Proposal, Construct, and Consistency agents is in\nyour memory. Synthesize it into ONE\
      \ hypothesis and ONE factor expression.\n\nOperator DSL (only these are valid):\n  Variables:  $open\
      \ $close $high $low $volume $return\n  1 arg:      RANK ZSCORE MEAN STD MAX MIN SKEW KURT MEDIAN\n\
      \  2 args:     TS_RANK TS_MEAN TS_STD TS_ZSCORE / MAX(A,B) MIN(A,B)\n  3 args:     TS_CORR TS_COVARIANCE\n\
      Rules: only $variables as leaves; respect arity; keep the expression short\n(target < 150 chars,\
      \ 2–4 base features).\n\nOutput EXACTLY two lines, nothing else:\nHYPOTHESIS: <one sentence>\nEXPRESSION:\
      \ <single DSL expression>"
    user: Output the final hypothesis and expression now.
